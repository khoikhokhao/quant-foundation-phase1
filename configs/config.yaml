# config.yaml  — one-file-to-rule-them-all

run:
  start_date: "2019-09-01"
  end_date: null          # null = đến hiện tại (UTC)
  timezone: "UTC"
  start_cash: 10000
  fee_bps: 5
  slippage_bps: 2

data:
  primary_exchange: "binance"
  fallbacks: ["okx", "kraken", "kucoin", "coinbase", "bitfinex", "gateio"]
  timeframe: "1d"

paths:
  results_dir: "results"
  figures_dir: "results/figures"
  logs_dir: "results/logs"

# ===== Profiles (chọn 1 để chạy) =====
profiles:

  RSI_ETH:
    asset: { symbol: "ETH/USDT" }
    strategy:
      name: "RSI"
      params: { period: 14, buy_th: 30, sell_th: 70 }
      shift_bars: 1
    backtest:
      report: ["Cumulative Return", "Sharpe (daily,252)", "Max Drawdown", "Trades", "Exposure %"]

  SMA_ETH:
    asset: { symbol: "ETH/USDT" }
    strategy:
      name: "SMA_Crossover"
      params: { fast: 20, slow: 50 }
      shift_bars: 1
    backtest:
      report: ["Cumulative Return", "Sharpe (daily,252)", "Max Drawdown", "Trades", "Exposure %"]

  SMA_BTC:
    asset: { symbol: "BTC/USDT" }
    strategy:
      name: "SMA_Crossover"
      params: { fast: 20, slow: 50 }
      shift_bars: 1
    backtest:
      report: ["Cumulative Return", "Sharpe (daily,252)", "Max Drawdown", "Trades", "Exposure %"]

# ===== Grid-search presets (tuỳ chọn) =====
grids:

  SMA_grid_BTC:
    profile: "SMA_BTC"             # dùng logic/fees/timeframe của profile này
    grid:
      fast: { start: 5, stop: 60, step: 5 }
      slow: { start: 50, stop: 250, step: 10 }
      min_trades: 10
      min_gap: 10                   # slow - fast >= 10
      score: "Sharpe"

  SMA_grid_ETH:
    profile: "SMA_ETH"
    grid:
      fast: { start: 5, stop: 60, step: 5 }
      slow: { start: 50, stop: 250, step: 10 }
      min_trades: 10
      min_gap: 10
      score: "Sharpe"
